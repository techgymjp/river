<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>渓流釣り</title>
<meta name="description" content="3Dで楽しむ日本の渓流釣りゲーム。ヤマメ・イワナを目印釣りで狙おう。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three/three.module.js",
    "three/addons/": "./js/vendor/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="topLeft" class="panel">
    <div class="logo" data-i18n="title.hud">渓流釣り</div>
    <div class="stats"><span id="timeLabel">--:--</span>　<span data-i18n="hud.catch">釣果</span> <b id="catchCount">0</b> <span data-i18n="hud.unit">尾</span>　<b id="score">0</b> pt</div>
  </div>
  <div id="topRight">
    <button id="btnZukan" class="btn" data-i18n="btn.zukan">図鑑</button>
    <button id="btnPause" class="btn" data-i18n="btn.pause">一時停止</button>
  </div>
  <div id="message"></div>
  <div id="biteAlert" data-i18n="bite">アタリ！</div>
  <div id="decoyHud" class="panel">
    <div class="row"><span data-i18n="hud.vigor">おとりの元気</span><div class="bar"><div id="vigorFill" class="fill vigor"></div></div></div>
  </div>
  <div id="fightHud" class="panel">
    <div class="row"><span data-i18n="hud.tension">テンション</span><div class="bar tension"><div class="zone"></div><div id="tensionFill" class="fill"></div></div></div>
    <div class="row"><span data-i18n="hud.stamina">魚の体力</span><div class="bar"><div id="staminaFill" class="fill stamina"></div></div></div>
  </div>
  <div id="mobileControls">
    <button id="btnUp" class="btn round" data-i18n="btn.up">◀ 上流</button>
    <button id="btnStrike" class="btn round strike"><span id="strikeLabel" data-i18n="btn.strike">合わせ</span><br><small data-i18n="btn.strike.sub">長押しで寄せ</small></button>
    <button id="btnDown" class="btn round" data-i18n="btn.down">下流 ▶</button>
  </div>
</div>

<div id="loading" class="screen show">
  <div class="logo big" data-i18n="title">渓流釣り</div>
  <div id="loadingText" data-i18n="load.init">読み込み中…</div>
</div>

<div id="titleScreen" class="screen">
  <div class="card top">
    <div class="logo big" data-i18n="title">渓流釣り</div>
    <p class="sub" data-i18n="title.sub"></p>
    <p class="best" id="titleBest"></p>
    <div class="topButtons">
      <button id="btnPlay" class="btn primary big" data-i18n="btn.play">プレイ</button>
      <button id="btnHowto" class="btn big" data-i18n="btn.howto">あそびかた</button>
    </div>
    <div class="legal" id="legal">
      <span id="buildInfo"></span>
      <a id="privacyLink" href="https://techgym.jp/privacy-policy/" target="_blank" rel="noopener" data-i18n="legal.privacy">プライバシーポリシー</a>
      <span id="adPrivacy" hidden>｜<a href="#" id="adPrivacyLink" data-i18n="legal.adSettings">広告の設定</a></span>
      ｜<button id="btnLang2" class="linkbtn" data-i18n="btn.lang">English</button>
    </div>
  </div>
</div>

<div id="setupScreen" class="screen">
  <div class="card">
    <h2 data-i18n="setup.title">釣りの準備</h2>
    <div class="opt">
      <div class="label" data-i18n="opt.method">釣り方</div>
      <div class="chips" data-key="method">
        <button data-val="bait" class="on" data-i18n="method.bait">エサ釣り</button>
        <button data-val="tomo" data-i18n="method.tomo">友釣り（アユ）</button>
      </div>
    </div>
    <div class="opt">
      <div class="label" data-i18n="opt.time">時間帯</div>
      <div class="chips" data-key="time">
        <button data-val="morning" class="on" data-i18n="time.morning">朝マズメ</button>
        <button data-val="noon" data-i18n="time.noon">日中</button>
        <button data-val="evening" data-i18n="time.evening">夕マズメ</button>
      </div>
    </div>
    <div class="opt">
      <div class="label" data-i18n="opt.season">季節</div>
      <div class="chips" data-key="season">
        <button data-val="spring" data-i18n="season.spring">新緑</button>
        <button data-val="summer" data-i18n="season.summer">盛夏</button>
        <button data-val="autumn" class="on" data-i18n="season.autumn">紅葉</button>
      </div>
    </div>
    <p class="tiny" id="titleTip"></p>
    <div class="buttons">
      <button id="btnStart" class="btn primary big" data-i18n="start">釣りを始める</button>
      <button id="btnSetupBack" class="btn" data-i18n="btn.back">戻る</button>
    </div>
  </div>
</div>

<div id="pauseScreen" class="modal">
  <div class="card pause">
    <h2 data-i18n="pause.title">一時停止</h2>
    <div class="menu">
      <button id="btnResume" class="btn primary big" data-i18n="pause.resume">再開</button>
      <button id="btnPauseHelp" class="btn" data-i18n="btn.howto">あそびかた</button>
      <button id="btnLog" class="btn" data-i18n="btn.log">釣果記録</button>
      <button id="btnBgm" class="btn">BGM ON</button>
      <button id="btnSound" class="btn">音 ON</button>
      <button id="btnLang" class="btn" data-i18n="btn.lang">English</button>
      <button id="btnEnd" class="btn" data-i18n="pause.end">釣りを終える</button>
      <button id="btnPauseTitle" class="btn" data-i18n="btn.toTitle">トップに戻る</button>
    </div>
  </div>
</div>

<div id="overScreen" class="screen">
  <div class="card over">
    <h2 data-i18n="over.title">本日の釣果</h2>
    <div class="overScore"><b id="overScore">0</b> pt　<span id="overCount"></span></div>
    <div id="overBody"></div>
    <p class="tiny" id="overRedo"></p>
    <div class="buttons">
      <button id="btnAgain" class="btn primary big" data-i18n="over.again">もう一度</button>
      <button id="btnShare" class="btn" data-i18n="over.share">シェア</button>
      <button id="btnOverTitle" class="btn" data-i18n="btn.toTitle">トップに戻る</button>
    </div>
  </div>
</div>

<div id="redo" hidden>
  <div class="redoText" id="redoNote"></div>
  <div class="buttons">
    <button id="redoWatch" class="btn primary"></button>
    <button id="redoNext" class="btn"></button>
  </div>
</div>

<div id="resultModal" class="modal">
  <div class="card result">
    <div class="caught" data-i18n="res.caught">釣り上げた！</div>
    <canvas id="fishPreview"></canvas>
    <div class="fishname" id="resName"></div>
    <div id="resBadges"></div>
    <div class="nums"><span id="resSize"></span><span id="resWeight"></span><span id="resPts"></span></div>
    <p id="resDesc"></p>
    <div class="buttons">
      <button id="btnRelease" class="btn primary"><span data-i18n="res.release">リリース</span> <small>+10%</small></button>
      <button id="btnKeep" class="btn" data-i18n="res.keep">キープ</button>
      <button id="btnResShare" class="btn" data-i18n="btn.share">シェア</button>
    </div>
  </div>
</div>

<div id="logModal" class="modal closable">
  <div class="card">
    <h2 data-i18n="log.title">釣果記録</h2>
    <div id="logBody"></div>
    <button class="btn" data-close data-i18n="btn.close">閉じる</button>
  </div>
</div>

<div id="zukanModal" class="modal closable">
  <div class="card zukan">
    <h2 data-i18n="zukan.title">魚図鑑</h2>
    <div id="zukanProgress" class="tiny"></div>
    <div id="zukanBody"></div>
    <button class="btn" data-close data-i18n="btn.close">閉じる</button>
  </div>
</div>

<div id="helpModal" class="modal closable">
  <div class="card help">
    <h2 data-i18n="help.title">遊び方</h2>
    <div id="helpBody"></div>
    <table id="helpKeys"></table>
    <p class="tiny" data-i18n="help.tip"></p>
    <button class="btn" data-close data-i18n="btn.close">閉じる</button>
  </div>
</div>

<script src="js/ads-config.js"></script>
<script src="js/build-info.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
